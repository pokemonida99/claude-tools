<!doctype html>
<html><head><meta charset="utf-8"><title>禮拜五下午 studio take</title>
<style>html,body{margin:0;background:#111}canvas{display:block;height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 9:16 one-take studio version (0–58.5s). Minimal "first take" look: white title card, thin lyrics, soft cross-fades.
// render(t) is pure in t; export.mjs awaits window.prep(t) to seek the clips.
const W = 1080, H = 1920, cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"Hiragino Sans","PingFang TC","Apple SD Gothic Neo",sans-serif';
// ?chorus → the extra final-chorus cut (song 150.4–171.7) built from F1–F3; t is always song time
const CHORUS = location.search.includes('chorus');
const T0 = CHORUS ? 150.4 : 0, END = CHORUS ? 171.7 : 58.5;
let TL, WARP = {};
const VID = {};
// ?nl → lyric-free lip-sync test: 5 chunks SA-SE from vidnl/, played 1:1 (no warp unless vidnl/warp.json has entries)
const NL = location.search.includes('nl');
const SDIR = NL ? 'vidnl/' : 'vidstudio/';
const SHOTS = NL ? [[0, 'SA'], [10.14, 'SB'], [24.47, 'SC'], [38.72, 'SD'], [51.65, 'SE']] : CHORUS ? [[151.16, 'F1'], [157.28, 'F2'], [165.04, 'F3']]
  : [[0.00, 'S1'], [20.36, 'S2'], [35.70, 'K1'], [43.00, 'K2'], [49.10, 'K3'], [53.78, 'K4']];   // [song time, clip]; warp.json maps song→clip time for lip-sync
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };

window.ready = (async () => {
  TL = await (await fetch(CHORUS ? 'timeline_full.json' : 'timeline.json')).json();
  try { WARP = await (await fetch(SDIR + 'warp.json')).json(); } catch (e) {}
  await Promise.all(SHOTS.map(async s => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    const r = await fetch(SDIR + s[1] + '.mp4'); if (!r.ok) return;
    v.src = URL.createObjectURL(await r.blob());
    await new Promise(res => { v.onloadeddata = res; v.onerror = res; }); VID[s[1]] = v;
  }));
  await document.fonts.load('300 60px "Hiragino Sans"').catch(() => {});
  render(0); return true;
})();
// song-relative time -> clip time through the lip-sync anchors (piecewise linear)
function warp(name, r) {
  const A = WARP[name]; if (!A || A.length < 2) return r;
  if (r <= A[0][0]) return A[0][1] + (r - A[0][0]);
  for (let i = 1; i < A.length; i++) if (r <= A[i][0]) { const [s0, c0] = A[i - 1], [s1, c1] = A[i]; return c0 + (c1 - c0) * (r - s0) / (s1 - s0); }
  const [s0, c0] = A[A.length - 1]; return c0 + (r - s0);
}
const shotAt = (t) => { let k = 0; SHOTS.forEach((s, i) => { if (t >= s[0]) k = i; }); return k; };
// frame-exact seek: snap to the middle of a 24fps source frame, then wait until that frame is actually presented
// (onseeked alone can fire before the new frame is drawable -> stale frames = stutter in the export)
const seekTo = (v, ct) => new Promise(res => {
  ct = Math.min((Math.floor(ct * 24) + 0.5) / 24, v.duration - 0.02);
  if (Math.abs(v.currentTime - ct) < 1e-4) return res();
  let done = false; const fin = () => { if (!done) { done = true; res(); } };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => fin());
  v.onseeked = () => { if (!v.requestVideoFrameCallback) fin(); else setTimeout(fin, 400); };
  v.currentTime = ct;
});
window.prep = async (t) => {
  const k = shotAt(t);
  for (const j of [k - 1, k]) {
    const s = SHOTS[j]; if (!s) continue; const v = VID[s[1]]; if (!v) continue;
    const ct = Math.min(Math.max(0, warp(s[1], t - s[0])), v.duration - 0.04);
    await seekTo(v, ct);
  }
};
function drawClip(k, a = 1) {
  const v = VID[SHOTS[k][1]]; if (!v) { g.fillStyle = '#eee'; g.fillRect(0, 0, W, H); return; }
  const s0 = Math.max(W / v.videoWidth, H / v.videoHeight), dw = v.videoWidth * s0, dh = v.videoHeight * s0;
  g.globalAlpha = a; g.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh); g.globalAlpha = 1;
}
function txt(s, x, y, size, color, weight = 300, spacing = 0) {
  g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 14; g.fillText(s, x, y); g.shadowBlur = 0;
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
// thin, quiet lyrics near the bottom; the whole line fades in, no karaoke pop
function lyrics(t) {
  const L = TL.lines.find(l => t >= l.s - 0.2 && t < l.e + 0.3); if (!L) return;
  const a = clamp((t - L.s + 0.2) / 0.35) * clamp((L.e + 0.3 - t) / 0.35);
  g.globalAlpha = a;
  txt(L.text.replace(/ /g, '　'), W / 2, 1650, 54, '#fff', 300, 4);
  if (L.sub) txt(L.sub, W / 2, 1722, 34, 'rgba(255,255,255,.85)', 300, 2);
  g.globalAlpha = 1;
}
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  const k = shotAt(t), d = t - SHOTS[k][0];   // before the first shot starts, hold its first frame
  if (k > 0 && d < 0.5) { drawClip(k - 1); drawClip(k, smooth(d / 0.5)); } else drawClip(k);
  const gr = g.createLinearGradient(0, 1450, 0, 1920); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = gr; g.fillRect(0, 1450, W, 470);
  lyrics(t);
  // opening white card (first ~0.85 s, fades as the first line starts)
  if (t < T0 + 1.3) {
    const a = 1 - smooth((t - T0 - 0.55) / 0.6);
    g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(0, 0, W, H);
    g.globalAlpha = a; g.shadowBlur = 0;
    g.font = `300 64px ${FONT}`; g.fillStyle = '#222'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('禮拜五下午', W / 2, 930);
    g.font = `300 30px ${FONT}`; g.fillStyle = '#888'; g.fillText(CHORUS ? 'STUDIO ONE TAKE · CHORUS' : 'STUDIO ONE TAKE', W / 2, 1010);
    g.globalAlpha = 1;
  }
  // closing: fade to white in the last 1.2 s
  if (t > END - 1.2) { const a = smooth((t - (END - 1.2)) / 1.2); g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(0, 0, W, H);
    g.globalAlpha = a; g.font = `300 56px ${FONT}`; g.fillStyle = '#222'; g.textAlign = 'center'; g.fillText('禮拜五下午', W / 2, 960); g.globalAlpha = 1; }
}
window.render = render;
</script></body></html>
